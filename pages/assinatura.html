<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTIGO</title>
    <link rel="stylesheet" href="../css/assinatura.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400.900;1,400.900&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <img
          src="../Imagens/Logo - Cafeteria.svg"
          alt="logomarca prime cofee"
        />
      </div>
      <nav>
        <a href="index.html">Página Inicial</a>
      </nav>
    </header>

    <main>
      <div class="imagem-xicara">
        <img src="../Imagens/Imagem - Xícara de Café.svg" alt="" />
      </div>
      <div class="texto-assinatura">
        <h1>Assinatura PRIME</h1>
        <h3>R$ 39,99</h3>
        <p>
          No dia 15 de cada mês você receberá uma caixa com um café inédito que
          foi produzido para cada mês, recém torrado e produzido por pequenos
          produtores de todo o país.
        </p>
        <button>Comprar Assinatura</button>
      </div>
    </main>

    <footer>
      <div class="footer">
        <div class="logo">
          <img src="../Imagens/Logo.png" alt="Logo Prime Coffee" />
        </div>
        <div class="redes_sociais">
          <a
            href="https://www.instagram.com/daniel____.s/"
            aria-label="Instagram"
          >
            <img src="../Imagens/instagram.png" alt="Instagram" />
          </a>
          <a
            href="https://www.facebook.com/profile.php?id=100009119093919"
            aria-label="Facebook"
          >
            <img src="../Imagens/facebook.png" alt="Facebook" />
          </a>
          <a href="https://x.com/f1_daniiel" aria-label="Twitter">
            <img src="../Imagens/twitter.png" alt="Twitter" />
          </a>
          <a
            href="https://www.linkedin.com/in/daniel-oliveira-11b5b7330/"
            aria-label="LinkedIn"
          >
            <img src="../Imagens/linkedin.png" alt="LinkedIn" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
