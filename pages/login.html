<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTIGO</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400.900;1,400.900&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <img
          src="../Imagens/Logo - Cafeteria.svg"
          alt="logomarca prime cofee"
        />
      </div>
      <nav>
        <a href="index.html">Página Inicial</a>
      </nav>
    </header>

    <main>
      <h1>Log-In</h1>
      <section class="logins">
        <div class="facebook">
          <button>
            <img src="../Imagens/facebook (1).png" alt="" />
            Continue with Facebook
          </button>
        </div>
        <div class="google">
          <button>
            <img src="../Imagens/pesquisa.png" alt="" />
            Continue with Google
          </button>
        </div>
        <div class="apple">
          <button>
            <img src="../Imagens/icons8-mac-os-50.png" alt="" />
            Continue with Apple
          </button>
        </div>
        <div class="criar-conta">
          <p>Don't have an account?</p>
          <button class="create-account">Create</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer">
        <div class="logo">
          <img src="../Imagens/Logo.png" alt="Logo Prime Coffee" />
        </div>
        <div class="redes_sociais">
          <a
            href="https://www.instagram.com/daniel____.s/"
            aria-label="Instagram"
          >
            <img src="../Imagens/instagram.png" alt="Instagram" />
          </a>
          <a
            href="https://www.facebook.com/profile.php?id=100009119093919"
            aria-label="Facebook"
          >
            <img src="../Imagens/facebook.png" alt="Facebook" />
          </a>
          <a href="https://x.com/f1_daniiel" aria-label="Twitter">
            <img src="../Imagens/twitter.png" alt="Twitter" />
          </a>
          <a
            href="https://www.linkedin.com/in/daniel-oliveira-11b5b7330/"
            aria-label="LinkedIn"
          >
            <img src="../Imagens/linkedin.png" alt="LinkedIn" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
